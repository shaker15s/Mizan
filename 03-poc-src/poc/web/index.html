<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="description" content="Mizan — Agent-Native ERP Cockpit: مساعد عربي مصري بيوصلك بـ Odoo من بوابة حوكمة موقّعة." />
    <title>Mizan · Agent-Native ERP Cockpit</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6f66'/%3E%3Cpath d='M16 6v20M9 26h14M16 9l-5 3m5-3 5 3M8 20l3-8 3 8a3 3 0 0 1-6 0Zm10 0 3-8 3 8a3 3 0 0 1-6 0Z' fill='none' stroke='%23fffdf9' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#chat-input">تخطَّ إلى صندوق الطلب</a>

    <div class="cockpit">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 5v22M9 27h14M16 9l-6 3.5m6-3.5 6 3.5M7 21l3-8.5 3 8.5a3.2 3.2 0 0 1-6 0Zm12 0 3-8.5 3 8.5a3.2 3.2 0 0 1-6 0Z" />
            </svg>
          </span>
          <span class="brand-text">
            <h1>Mizan</h1>
            <p>Agent-Native ERP Cockpit · Odoo 19</p>
          </span>
        </div>

        <div class="statusbar" id="statusbar" aria-label="حالة النظام" role="status">
          <span class="stat"><span class="dot" aria-hidden="true"></span><span>بيتصل…</span></span>
        </div>

        <div class="top-actions">
          <button class="icon-btn" id="btn-commands" type="button" title="لوحة الأوامر (Ctrl/⌘ + K)" aria-label="لوحة الأوامر">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M3.5 7h17v10h-17zM6.5 10.5h.01M10 10.5h.01M13.5 10.5h.01M17 10.5h.01M7 14h10" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-refresh-telemetry" type="button" title="تحديث القياسات" aria-label="تحديث القياسات">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-theme" type="button" aria-pressed="false" title="الوضع الداكن" aria-label="بدّل السمة">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 13.5A8.5 8.5 0 0 1 10.5 4 8.5 8.5 0 1 0 20 13.5Z" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-audit-drawer" type="button" title="سجل التدقيق" aria-label="افتح سجل التدقيق">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 4h6l4 4v12H8zM14 4v4h4M11 12h6M11 16h6" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-tools-modal" type="button" title="عقود الأدوات" aria-label="افتح عقود الأدوات">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 6.5a3.5 3.5 0 0 0 4.7 3.3l-8 8a2.3 2.3 0 1 1-3.3-3.2l8-8a3.5 3.5 0 0 0-3.2-4.7M6.5 17.5h.01" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-settings" type="button" title="الإعدادات" aria-label="افتح الإعدادات">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
              <path d="M19.4 12a7.4 7.4 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2-1.2l-.4-2.5H9.8l-.4 2.5c-.7.3-1.4.7-2 1.2l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1c.6.5 1.3.9 2 1.2l.4 2.5h4.4l.4-2.5c.7-.3 1.4-.7 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-rail-toggle" type="button" title="إظهار/إخفاء الشريط الجانبي" aria-label="بدّل الشريط الجانبي">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 5h16v14H4zM14 5v14" />
            </svg>
          </button>
        </div>
      </header>

      <div class="layout" data-rail="open">
        <section class="thread-col" aria-label="محادثة المساعد">
          <div class="thread" id="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>

          <div class="dock">
            <div class="pipeline" id="pipeline-stepper" hidden></div>
            <div class="suggest-row" id="suggest-row"></div>

            <form class="composer" id="chat-form" autocomplete="off">
              <div class="palette" id="slash-palette" hidden></div>
              <div class="composer-inner">
                <label class="visually-hidden" for="chat-input">اكتب طلبك بالمصري</label>
                <textarea id="chat-input" rows="1" placeholder="مثلاً: اعمل طلب بيع للعميل 42 لعدد 15 من المنتج 55 — أو اكتب / للأوامر"></textarea>
                <div class="composer-side">
                  <span class="composer-hint" aria-hidden="true"><kbd>Enter</kbd> إرسال · <kbd>Shift</kbd>+<kbd>Enter</kbd> سطر</span>
                  <button class="icon-btn" id="btn-voice" type="button" aria-pressed="false" title="إملاء صوتي (تجريبي)" aria-label="إملاء صوتي">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M12 3.5a2.6 2.6 0 0 1 2.6 2.6V11a2.6 2.6 0 0 1-5.2 0V6.1A2.6 2.6 0 0 1 12 3.5ZM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
                    </svg>
                  </button>
                  <button class="icon-btn" id="btn-stop" type="button" title="إلغاء الطلب الجاري (Esc)" aria-label="ألغِ الطلب الجاري">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" /></svg>
                  </button>
                  <button class="send-btn" id="btn-send" type="submit">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon icon-flip">
                      <path d="M4 12h13m0 0-5-5m5 5-5 5" />
                    </svg>
                    <span>أرسل</span>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </section>

        <aside class="rail" id="rail" aria-label="أدوات التحقق والسياق">
          <nav class="rail-tabs" id="rail-tabs" role="tablist" aria-label="أقسام الشريط"></nav>
          <div class="rail-panels" id="rail-panels"></div>
        </aside>
      </div>
    </div>

    <div id="toasts" aria-live="polite"></div>
    <div id="modal-root" class="modal-root" hidden></div>

    <!-- Compatibility hooks the server smoke tests and the eval report link to. -->
    <span hidden id="model-label"></span>
    <span hidden id="odoo-db-label"></span>
    <span hidden id="uptime-label"></span>
    <span hidden id="header-odoo-status"></span>
    <span hidden id="telemetry-live-badge"></span>
    <span hidden id="tools-count">5</span>
    <span hidden id="audit-count">0</span>
    <span hidden id="audit-chain-badge"></span>
    <span hidden id="replay-feedback"></span>
  </body>
</html>
