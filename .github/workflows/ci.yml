name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-poc-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 03-poc-src/requirements.txt
      - run: pip install -r requirements.txt
      # The 5 integration tests auto-skip without a live Odoo instance.
      - run: pytest tests/ -q
